name: Release readiness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: readiness
          POSTGRES_PASSWORD: readiness
          POSTGRES_DB: faramace_readiness
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U readiness -d faramace_readiness"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://readiness:readiness@127.0.0.1:5432/faramace_readiness
      TEST_DATABASE_URL: postgresql://readiness:readiness@127.0.0.1:5432/faramace_readiness
      NEW_DATABASE_URL: postgresql://readiness:readiness@127.0.0.1:5432/faramace_readiness
      AUTH_SECRET: ci-only-not-a-production-secret-123456789
      NEXTAUTH_SECRET: ci-only-not-a-production-secret-123456789
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @faramace/shared build
      - run: pnpm check:dependencies
      - run: node --test scripts/check-dependencies.test.mjs
      - run: node --test scripts/security-compatibility.test.mjs
      - run: node --test scripts/image-size-security.test.mjs
      - run: pnpm --filter web exec prisma generate
      # Historical migrations are pinned by hash and never edited.
      - run: node --test scripts/migrations.test.mjs
      # pg_dump must match the postgres:17 service.
      - run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      # New database from the chain alone; upgrade of restored copies; refusals.
      - run: node --test --test-concurrency=1 scripts/migrations.integration.test.mjs
        env:
          MIGRATION_TEST_ADMIN_URL: postgresql://readiness:readiness@127.0.0.1:5432/postgres
      # New database: prisma migrate deploy only, then verified against schema.prisma.
      - run: node scripts/bootstrap-empty-db.mjs
      - run: pnpm --filter web test
      - run: pnpm --filter desktop test
      - run: pnpm --filter web test:integration
      - run: pnpm --filter web exec tsc --noEmit --incremental false
      - run: pnpm --filter web exec next build
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node --test scripts/audit-mitigations.test.mjs
      - run: pnpm audit:prod
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-audit
          path: artifacts/audit-prod*.json
