name: Mobile automatic updates

on:
  push:
    branches: [004-dynamic-subscriptions, codex/release-readiness-fixes, codex/mobile-automatic-updates]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - '.github/workflows/mobile-update.yml'
      - 'scripts/check-mobile-runtime.mjs'
      - 'scripts/check-mobile-runtime.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-production-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_API_URL: https://app.faramace.com/api
      EXPO_NO_DOTENV: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Mobile tests
        run: pnpm --filter faramace-mobile test
      - name: Mobile TypeScript
        run: pnpm --filter faramace-mobile typecheck
      - name: Verify native compatibility before publishing
        run: |
          node --test scripts/check-mobile-runtime.test.mjs
          node scripts/check-mobile-runtime.mjs
      - name: Verify Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo '::error::Add the Expo access token to the EXPO_TOKEN repository secret.'
            exit 1
          fi
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 21.2.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish compatible updates to installed production apps
        working-directory: apps/mobile
        run: eas update --channel production --platform all --message "GitHub ${{ github.sha }}" --non-interactive
